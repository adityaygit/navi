<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Navi</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #f5f5f7; font-family: "Segoe UI", -apple-system, system-ui, sans-serif; text-align: center; }
  .stone { width: 72px; height: 66px; border-radius: 50% 50% 46% 54% / 56% 52% 48% 44%; background: radial-gradient(circle at 33% 27%, #fff 0%, #cff6dd 9%, #8bdcaf 34%, #2f8566 70%, #0f3328 100%); opacity: .6; }
  h1 { margin: 12px 0 0; font-size: 26px; letter-spacing: -0.02em; }
  p { margin: 0; color: #a0a0a8; font-size: 15px; max-width: 380px; line-height: 1.5; }
  button { margin-top: 10px; height: 46px; padding: 0 26px; border: 0; border-radius: 23px; background: #f5f5f7; color: #000; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid #a7ebc0; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="stone" aria-hidden="true"></div>
  <h1>Can't reach Navi</h1>
  <p>Check your internet connection. Nothing you saved is lost; Navi picks up where you left off once you're back online.</p>
  <button id="retry" type="button" autofocus>Try again</button>
  <script>
    const target = new URLSearchParams(location.search).get("retry");
    const go = () => { if (target && /^https?:\/\//.test(target)) location.href = target; };
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
  </script>
</body>
</html>
