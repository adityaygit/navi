<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navi My day calendar week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A7EBC0}a:hover{color:#D2F6DF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #000000; color: #F5F5F7; font-family: Figtree, sans-serif; font-size: 14px; font-feature-settings: 'tnum'; overflow: hidden">

  <nav aria-label="Main" style="width: 236px; padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; margin-bottom: 16px">
      <span aria-hidden="true" style="width: 18px; height: 16px; border-radius: 50% 50% 46% 54% / 56% 52% 48% 44%; background: radial-gradient(circle at 34% 28%, #F4FFF8 0%, #A7EBC0 30%, #2E7D63 100%)"></span>
      <span style="font-weight: 700; font-size: 16px; flex: 1">Navi</span>
      <a href="V4-Advanced.dc.html" aria-label="Search and commands, ⌘K" style="width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #7C7C85"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></a>
    </div>
    <a href="V3-Home.dc.html" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #A0A0A8; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"></path></svg>Home</a>
    <a href="V3-Tasks.dc.html" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #A0A0A8; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>Tasks</a>
    <a href="#" aria-current="page" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #F5F5F7; text-decoration: none; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><circle cx="12" cy="12" r="4"></circle></svg>My day</a>
    <a href="#" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #A0A0A8; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5 5h14l2 8v6H3v-6z"></path></svg><span style="flex: 1">Inbox</span><span style="font-size: 12px; color: #000; background: #A7EBC0; border-radius: 10px; padding: 1px 7px; font-weight: 600">2</span></a>
    <a href="#" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #A0A0A8; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>Focus</a>
    <div style="margin: 26px 0 8px; padding: 0 12px; font-size: 12.5px; color: #7C7C85; font-weight: 500">Spaces</div>
    <a href="#" style="height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #C8C8CE; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: #9DB8FF"></span>School</a>
    <a href="#" style="height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #C8C8CE; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F2A7A0"></span>Health</a>
    <a href="#" style="height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #C8C8CE; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C7A6F7"></span>Hobbies</a>
    <a href="#" style="height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #C8C8CE; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F4B37A"></span>Friends</a>
    <a href="#" style="height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #C8C8CE; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: #E9C46A"></span>Home</a>
    <a href="#" style="height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #C8C8CE; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: #8EC5E6"></span>Work</a>
  </nav>

  <main style="flex: 1; min-width: 0; padding: 26px 24px 0 36px; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.03em">This week</h1>
      <span style="color: #7C7C85; font-size: 15px; margin-left: 4px">Nov 2 – 8</span>
      <span style="flex: 1"></span>
      <button type="button" aria-label="Previous week" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; color: #C8C8CE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14.5 6-6 6 6 6"></path></svg></button>
      <button type="button" aria-label="Next week" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; color: #C8C8CE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.06); color: #C8C8CE">Today</button>
      <div role="group" aria-label="Range" style="display: flex; padding: 3px; border-radius: 19px; background: rgba(255,255,255,0.06); margin-left: 6px">
        <button type="button" style="height: 32px; padding: 0 14px; border-radius: 16px; color: #C8C8CE">Day</button>
        <button type="button" aria-pressed="true" style="height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.14); color: #F5F5F7; font-weight: 600">Week</button>
      </div>
      <div role="group" aria-label="View" style="display: flex; padding: 3px; border-radius: 19px; background: rgba(255,255,255,0.06)">
        <a href="V3-Planner.dc.html" style="height: 32px; padding: 0 16px; border-radius: 16px; color: #C8C8CE; text-decoration: none; display: flex; align-items: center">Timeline</a>
        <a href="#" aria-current="true" style="height: 32px; padding: 0 16px; border-radius: 16px; background: #F5F5F7; color: #000000; font-weight: 600; text-decoration: none; display: flex; align-items: center">Calendar</a>
      </div>
    </div>
    <p style="margin: 8px 0 0; font-size: 17px; font-weight: 500; letter-spacing: -0.01em"><span style="color: #F5F5F7">Friday's the full one — 9½ hours planned.</span><span style="color: #6E6E77"> Saturday has just brunch with Jo.</span></p>

    <div style="display: flex; margin-top: 18px">
      <span style="width: 56px; flex-shrink: 0"></span>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 8px">
            <span style="color: {{d.nameFg}}; font-size: 13px">{{d.name}}</span>
            <span style="min-width: 28px; height: 28px; border-radius: 14px; background: {{d.numBg}}; color: {{d.numFg}}; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center">{{d.num}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; margin-top: 2px">
      <span style="width: 56px; flex-shrink: 0; color: #6E6E77; font-size: 11.5px; display: flex; align-items: center">all day</span>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="height: 30px; display: flex; align-items: center">
            <sc-for list="{{d.allday}}" as="a" hint-placeholder-count="1">
              <span style="width: 100%; height: 24px; border-radius: 8px; background: {{a.bg}}; border: {{a.border}}; box-sizing: border-box; color: {{a.fg}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden">{{a.label}}</span>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; margin-top: 8px">
      <div style="width: 56px; flex-shrink: 0; position: relative; height: 640px">
        <sc-for list="{{hours}}" as="h" hint-placeholder-count="16">
          <span style="position: absolute; top: {{h.top}}; left: 0; color: #6E6E77; font-size: 11.5px">{{h.label}}</span>
        </sc-for>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; height: 640px; background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.06) 0, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 40px)">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="position: relative; height: 640px; border-radius: 10px; background: {{d.colBg}}">
            <sc-for list="{{d.events}}" as="e" hint-placeholder-count="4">
              <div style="position: absolute; left: 3px; right: 3px; top: {{e.top}}; height: {{e.h}}; box-sizing: border-box; border-radius: 9px; background: {{e.bg}}; border: {{e.border}}; padding: {{e.pad}}; display: flex; flex-direction: column; gap: 1px; overflow: hidden; opacity: {{e.op}}">
                <span style="font-size: 12.5px; font-weight: 600; color: {{e.fg}}; line-height: 1.25; text-decoration: {{e.strike}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span>
                <sc-if value="{{e.showTime}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11.5px; color: {{e.sub}}; white-space: nowrap">{{e.time}}</span></sc-if>
              </div>
            </sc-for>
            <sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 246px; height: 2px; background: #F5F5F7; z-index: 2"></span>
              <span aria-hidden="true" style="position: absolute; left: -4px; top: 242px; width: 10px; height: 10px; border-radius: 5px; background: #F5F5F7; z-index: 2"></span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>

  <aside aria-label="Navi (docked)" style="width: 68px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 26px; gap: 14px">
    <a href="V4-Panel-States.dc.html" aria-label="Open Navi" style="width: 34px; height: 31px; border-radius: 50% 50% 46% 54% / 56% 52% 48% 44%; background: radial-gradient(circle at 33% 27%, #FFFFFF 0%, #CFF6DD 12%, #8BDDAF 38%, #2F8566 75%, #0F3328 100%); box-shadow: 0 0 20px rgba(139,221,175,0.3); display: block"></a>
    <button type="button" aria-label="Start voice" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const S = { School: '#9DB8FF', Health: '#F2A7A0', Hobbies: '#C7A6F7', Friends: '#F4B37A', Home: '#E9C46A', Work: '#8EC5E6', Routine: '#6E6E77', Navi: '#A7EBC0' };
    const L = { School: '#CFDBFF', Health: '#FAD3CF', Hobbies: '#E3D3FB', Friends: '#FBD9BB', Home: '#F4E2B4', Work: '#C6E2F2', Routine: '#A0A0A8', Navi: '#D2F6DF' };
    const tint = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const H = 40, START = 7;
    const ev = (s, e, title, space, kind, time, o) => {
      const opt = o || {};
      const c = S[space];
      const len = e - s;
      const fixed = kind === 'fixed';
      return {
        top: ((s - START) * H + 1) + 'px', h: Math.max(len * H - 3, 17) + 'px', title, time,
        showTime: len >= 0.75,
        pad: len >= 0.75 ? '6px 8px' : '1px 8px',
        bg: fixed ? tint(c, 0.22) : (kind === 'ghost' ? 'rgba(167,235,192,0.05)' : 'rgba(255,255,255,0.035)'),
        border: fixed ? '0' : (kind === 'routine' ? '1px dashed ' + tint(c, 0.8) : (kind === 'ghost' ? '1.5px dashed rgba(167,235,192,0.55)' : '1.5px solid ' + tint(c, 0.75))),
        fg: fixed ? L[space] : (kind === 'routine' ? '#8E8E96' : '#F5F5F7'),
        sub: fixed ? tint(c, 0.85) : '#8E8E96',
        op: opt.done ? 0.45 : 1, strike: opt.done ? 'line-through' : 'none'
      };
    };
    const wind = () => ev(22.5, 23, 'Wind down', 'Routine', 'routine', '');
    const allday = (label, space, kind) => ({
      label,
      bg: kind === 'due' ? 'transparent' : tint(S[space], 0.22),
      border: kind === 'due' ? '1px solid ' + tint('#F0B868', 0.6) : '0',
      fg: kind === 'due' ? '#F0B868' : L[space]
    });
    const day = (name, num, events, ad, today) => ({
      name, num, events, allday: ad || [], today: !!today,
      nameFg: today ? '#F5F5F7' : '#8E8E96',
      numBg: today ? '#F5F5F7' : 'transparent', numFg: today ? '#000000' : '#F5F5F7',
      colBg: today ? 'rgba(255,255,255,0.025)' : 'transparent'
    });
    const hours = [];
    for (let h = 8; h <= 22; h++) {
      const label = h === 12 ? 'Noon' : (h < 12 ? h + ' AM' : (h - 12) + ' PM');
      hours.push({ label, top: ((h - START) * H - 7) + 'px' });
    }
    return {
      hours,
      days: [
        day('Mon', '2', [
          ev(8.75, 11, 'Modern History', 'School', 'fixed', '8:45 – 11:00'),
          ev(16, 19, 'Shift at the café', 'Work', 'fixed', '4:00 – 7:00'),
          wind()
        ]),
        day('Tue', '3', [
          ev(9, 12, 'Biology', 'School', 'fixed', '9:00 – 12:00'),
          ev(14, 15, 'Essay: outline', 'School', 'flex', '2:00 – 3:00', { done: true }),
          wind()
        ]),
        day('Wed', '4', [
          ev(8, 8.5, 'Morning run', 'Health', 'flex', ''),
          ev(8.75, 11, 'Modern History', 'School', 'fixed', '8:45 – 11:00'),
          ev(17, 17.75, 'Physio', 'Health', 'fixed', '5:00 – 5:45'),
          wind()
        ]),
        day('Thu', '5', [
          ev(9, 12, 'Biology', 'School', 'fixed', '9:00 – 12:00'),
          ev(16, 19, 'Shift at the café', 'Work', 'fixed', '4:00 – 7:00'),
          wind()
        ]),
        day('Fri', '6', [
          ev(8, 8.5, 'Morning run', 'Health', 'flex', '', { done: true }),
          ev(8.75, 11, 'Modern History', 'School', 'fixed', '8:45 – 11:00'),
          ev(14, 15.5, 'Essay: write the intro', 'School', 'flex', '2:00 – 3:30'),
          ev(15.5, 16, 'Dentist call fits', 'Navi', 'ghost', ''),
          ev(16, 19, 'Shift at the café', 'Work', 'fixed', '4:00 – 7:00'),
          ev(19.5, 21.5, 'Dinner with Maya', 'Friends', 'fixed', '7:30 – 9:30'),
          ev(22, 22.4, 'Practise the song', 'Hobbies', 'flex', ''),
          wind()
        ], [allday('Essay due', 'School', 'due')], true),
        day('Sat', '7', [
          ev(11, 12.5, 'Brunch with Jo', 'Friends', 'fixed', '11:00 – 12:30')
        ]),
        day('Sun', '8', [
          ev(10, 11, 'Laundry + groceries', 'Home', 'flex', '10:00 – 11:00'),
          wind()
        ], [allday('Maya’s birthday', 'Friends', 'event')])
      ]
    };
  }
}
</script>
</body>
</html>
