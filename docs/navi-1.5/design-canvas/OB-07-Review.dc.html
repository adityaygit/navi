<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navi onboarding review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A7EBC0}a:hover{color:#D2F6DF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; background: #000000; color: #F5F5F7; font-family: Figtree, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 80px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 40px">
    <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 18px; height: 16px; border-radius: 50% 50% 46% 54% / 56% 52% 48% 44%; background: radial-gradient(circle at 34% 28%, #F4FFF8 0%, #A7EBC0 30%, #2E7D63 100%)"></span><span style="font-weight: 700; font-size: 16px">Navi</span></span>
    <div role="img" aria-label="Step 4 of 5" style="display: flex; gap: 6px"><span style="width: 28px; height: 3px; border-radius: 2px; background: #F5F5F7"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #F5F5F7"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #F5F5F7"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #F5F5F7"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #2A2A2E"></span></div>
    <a href="OB-10-HomeLater.dc.html" style="justify-self: end; color: #8E8E96; text-decoration: none">Do this later</a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14px 0 0; min-height: 0">
    <div style="width: 1080px; display: flex; flex-direction: column; flex: 1; min-height: 0">
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.03em">Here's what I'd set up</h1>
      <p style="margin: 8px 0 0; color: #8E8E96; font-size: 16px">Nothing is real until you turn it on. Things I wasn't sure about start unchecked. Click any item to change it.</p>

      <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
          <section aria-label="{{g.title}}" style="border-radius: 22px; background: #0C0C0D; border: 1px solid rgba(255,255,255,0.07); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
            <span style="color: #8E8E96; font-size: 13px; font-weight: 600; padding-bottom: 6px">{{g.title}}</span>
            <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
              <label style="display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; cursor: pointer">
                <input type="checkbox" checked="{{i.on}}" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #A7EBC0; flex-shrink: 0">
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                  <span style="font-weight: 600; color: {{i.fg}}; display: flex; align-items: center; gap: 7px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{i.dot}}; flex-shrink: 0"></span>{{i.title}}</span>
                  <span style="color: #8E8E96; font-size: 13px">{{i.sub}}</span>
                </span>
              </label>
            </sc-for>
          </section>
        </sc-for>
      </div>

      <span style="flex: 1"></span>
      <div style="margin: 0 0 28px; display: flex; align-items: center; gap: 12px; border-radius: 28px; background: rgba(28,28,31,0.92); border: 1px solid rgba(255,255,255,0.09); padding: 8px 8px 8px 22px">
        <span style="flex: 1; color: #A0A0A8">Unchecked items wait in your Inbox. Nothing is lost.</span>
        <a href="OB-06-TalkLater.dc.html" style="height: 46px; padding: 0 18px; border-radius: 23px; background: rgba(255,255,255,0.07); color: #F5F5F7; text-decoration: none; display: flex; align-items: center">Keep talking</a>
        <a href="OB-08-StayInTouch.dc.html" style="height: 46px; padding: 0 22px; border-radius: 23px; background: #A7EBC0; color: #00140A; font-weight: 600; text-decoration: none; display: flex; align-items: center">Turn on 16 and plan my week</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const S = { School: '#9DB8FF', Health: '#F2A7A0', Hobbies: '#C7A6F7', Friends: '#F4B37A', Home: '#E9C46A', Work: '#8EC5E6', Routine: '#6E6E77', Navi: '#A7EBC0' };
    const it = (title, sub, space, on) => ({ title, sub, dot: S[space], on: on !== false, fg: on === false ? '#8E8E96' : '#F5F5F7' });
    return {
      groups: [
        { title: 'Spaces', items: [it('School', 'Classes, essays, exams', 'School'), it('Work', 'Café shifts', 'Work'), it('Health', 'Runs, sleep', 'Health'), it('Friends', 'Maya, Jo, plans', 'Friends')] },
        { title: 'Fixed things and routines', items: [it('Modern History', 'Mon, Wed · 8:45 – 11:00', 'School'), it('Biology', 'Tue, Thu · 9:00 – 12:00', 'School'), it('Shift at the café', 'Mon, Thu · 4:00 – 7:00', 'Work'), it('Morning run', 'Wed, Fri · 30 min before class', 'Health'), it('Wind down', 'Every night from 11:00', 'Routine'), it('Gym on weekends?', 'You said “maybe the gym sometimes”', 'Health', false)] },
        { title: 'Goals and projects', items: [it('History essay', 'First draft due Friday', 'School'), it('Lisbon trip', 'In the spring, with Jo', 'Friends')] },
        { title: 'Tasks', items: [it('Write the essay intro', '90 min · this week', 'School'), it('Book the dentist', '10 min · before Monday', 'Health'), it('Get Maya a birthday gift', 'Before Sunday', 'Friends')] },
        { title: 'Things Navi will remember', items: [it('You study best in the afternoon', 'You can see and delete this anytime', 'Navi'), it('Maya’s birthday is November 8', 'From “her birthday’s the 8th”', 'Friends')] }
      ]
    };
  }
}
</script>
</body>
</html>
