<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navi onboarding basics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A7EBC0}a:hover{color:#D2F6DF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; background: #000000; color: #F5F5F7; font-family: Figtree, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 80px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 40px">
    <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 18px; height: 16px; border-radius: 50% 50% 46% 54% / 56% 52% 48% 44%; background: radial-gradient(circle at 34% 28%, #F4FFF8 0%, #A7EBC0 30%, #2E7D63 100%)"></span><span style="font-weight: 700; font-size: 16px">Navi</span></span>
    <div role="img" aria-label="Step 2 of 5" style="display: flex; gap: 6px"><span style="width: 28px; height: 3px; border-radius: 2px; background: #F5F5F7"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #F5F5F7"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #2A2A2E"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #2A2A2E"></span><span style="width: 28px; height: 3px; border-radius: 2px; background: #2A2A2E"></span></div>
    <a href="OB-10-HomeLater.dc.html" style="justify-self: end; color: #8E8E96; text-decoration: none">Do this later</a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 70px">
    <h1 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.03em">A few basics</h1>
    <p style="margin: 10px 0 0; color: #8E8E96; font-size: 17px">So I get your days right from the start.</p>

    <form style="margin-top: 44px; width: 520px; display: flex; flex-direction: column; gap: 26px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="name" style="color: #A0A0A8; font-size: 14px">What should I call you?</label>
        <input id="name" type="text" value="Alex" autocomplete="given-name" style="height: 54px; border-radius: 18px; background: #0E0E10; border: 1px solid rgba(255,255,255,0.12); color: #F5F5F7; font: inherit; font-size: 17px; padding: 0 20px; outline: none">
        <span style="color: #6E6E77; font-size: 13px">From your Google account. Change it if you like.</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="color: #A0A0A8; font-size: 14px">Your timezone</span>
        <div style="height: 54px; border-radius: 18px; background: #0E0E10; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; padding: 0 8px 0 20px; gap: 12px">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: rgba(167,235,192,0.18); color: #A7EBC0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
          <span style="flex: 1; font-size: 17px">London <span style="color: #8E8E96">· it's 1:10 PM</span></span>
          <button type="button" style="height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(255,255,255,0.07); color: #C8C8CE">Change</button>
        </div>
      </div>

      <div style="display: flex; gap: 14px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span style="color: #A0A0A8; font-size: 14px">Usually up at</span>
          <div style="height: 76px; border-radius: 20px; background: #0E0E10; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
            <button type="button" aria-label="Earlier wake-up" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.07); font-size: 20px">−</button>
            <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">7:00 <span style="font-size: 15px; color: #8E8E96; font-weight: 500">AM</span></span>
            <button type="button" aria-label="Later wake-up" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.07); font-size: 20px">+</button>
          </div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <span style="color: #A0A0A8; font-size: 14px">Usually in bed by</span>
          <div style="height: 76px; border-radius: 20px; background: #0E0E10; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
            <button type="button" aria-label="Earlier bedtime" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.07); font-size: 20px">−</button>
            <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">11:30 <span style="font-size: 15px; color: #8E8E96; font-weight: 500">PM</span></span>
            <button type="button" aria-label="Later bedtime" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.07); font-size: 20px">+</button>
          </div>
        </div>
      </div>
      <span style="color: #6E6E77; font-size: 13px; margin-top: -14px">I only plan between these times, and won't message you outside them.</span>

      <a href="OB-05-Talk.dc.html" style="align-self: center; margin-top: 10px; height: 54px; padding: 0 40px; border-radius: 27px; background: #F5F5F7; color: #000000; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center">Continue</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
