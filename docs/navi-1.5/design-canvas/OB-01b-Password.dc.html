<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A7EBC0}a:hover{color:#D2F6DF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; background: #000000; color: #F5F5F7; font-family: Figtree, sans-serif; font-size: 15px; display: flex; flex-direction: column; align-items: center; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 50%; top: -280px; width: 900px; height: 640px; margin-left: -450px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(167,235,192,0.10) 0%, rgba(167,235,192,0.03) 40%, rgba(0,0,0,0) 70%)"></div>

  <div aria-hidden="true" style="margin-top: 150px; width: 76px; height: 69px; border-radius: 50% 50% 46% 54% / 56% 52% 48% 44%; background: radial-gradient(circle at 33% 27%, #FFFFFF 0%, #CFF6DD 9%, #8BDDAF 34%, #2F8566 70%, #0F3328 100%); box-shadow: inset -8px -9px 18px rgba(0,0,0,0.5), inset 5px 6px 12px rgba(255,255,255,0.25), 0 30px 70px rgba(139,221,175,0.2); position: relative"></div>
  <h1 style="margin: 30px 0 0; font-size: 36px; font-weight: 700; letter-spacing: -0.03em; position: relative">Welcome back</h1>
  <p style="margin: 10px 0 0; color: #8E8E96; font-size: 17px; position: relative">Sign in with your password.</p>

  <form style="margin-top: 40px; width: 380px; display: flex; flex-direction: column; gap: 12px; position: relative">
    <label for="pw-email" style="color: #A0A0A8; font-size: 13px; padding-left: 20px">Email</label>
    <input id="pw-email" type="email" value="alex@example.com" autocomplete="email" style="height: 50px; border-radius: 25px; background: #0E0E10; border: 1px solid rgba(255,255,255,0.12); color: #F5F5F7; font: inherit; padding: 0 20px; outline: none; margin-top: -4px">
    <label for="pw" style="color: #A0A0A8; font-size: 13px; padding-left: 20px; margin-top: 4px">Password</label>
    <input id="pw" type="password" value="password12" autocomplete="current-password" style="height: 50px; border-radius: 25px; background: #0E0E10; border: 1px solid rgba(167,235,192,0.5); color: #F5F5F7; font: inherit; padding: 0 20px; outline: none; margin-top: -4px">
    <a href="OB-03-Hello.dc.html" style="height: 50px; margin-top: 8px; border-radius: 25px; background: #F5F5F7; color: #000000; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in</a>
    <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 14px">
      <a href="OB-01-SignIn.dc.html" style="color: #A0A0A8; text-decoration: underline; text-underline-offset: 3px">Use a code instead</a>
      <a href="OB-02-Code.dc.html" style="color: #A0A0A8; text-decoration: underline; text-underline-offset: 3px">Forgot password?</a>
    </div>
  </form>

  <p style="position: absolute; bottom: 40px; margin: 0; color: #6E6E77; font-size: 13px">No password yet? Sign in with a code, then add one in Settings.</p>
</div>
</x-dc>

</html>
