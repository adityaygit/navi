<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction B Night Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F0A44B}a:hover{color:#F7C27E}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #0D0E11; color: #ECEAE6; font-family: 'Instrument Sans', sans-serif; font-size: 15px">
  <nav aria-label="Main" style="width: 72px; border-right: 1px solid #1F2127; display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 8px">
    <span style="width: 26px; height: 26px; border-radius: 50%; background: {{accent}}; margin-bottom: 18px"></span>
    <a href="#" aria-label="Home" style="width: 44px; height: 44px; border-radius: 12px; background: #1E2026; display: flex; align-items: center; justify-content: center; color: #ECEAE6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="#" aria-label="Planner" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #A19D96"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <a href="#" aria-label="Tasks" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #A19D96"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg></a>
    <a href="#" aria-label="Projects" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #A19D96"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="#" aria-label="Inbox, 2 to review" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #A19D96; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"></path></svg><span style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span></a>
    <a href="#" aria-label="Focus" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #A19D96"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg></a>
  </nav>
  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 96px 40px 40px; gap: 30px">
    <div aria-hidden="true" style="width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #FFD9A8 0%, {{accent}} 42%, #7A3E0E 100%); box-shadow: 0 0 80px rgba(240,164,75,0.35)"></div>
    <div style="text-align: center; display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -0.02em">Evening. One thing left from today.</h1>
      <p style="margin: 0; color: #A19D96; font-size: 16px">You planned the budget draft for 2:00 and got halfway.</p>
    </div>
    <div style="width: 660px; background: #16181D; border: 1px solid #262931; border-radius: 18px; padding: 20px 22px; display: flex; align-items: center; gap: 18px; box-sizing: border-box">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: {{accent}}; letter-spacing: 0.06em">CONTINUE</span>
        <span style="font-weight: 600; font-size: 17px">Finish the quarterly budget draft</span>
        <span style="color: #A19D96">45 min done · ~40 min to go · Work</span>
      </div>
      <a href="#" style="height: 46px; padding: 0 20px; border-radius: 14px; background: {{accent}}; color: #1A1206; font-weight: 700; display: flex; align-items: center; text-decoration: none">Resume focus</a>
      <a href="#" style="height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid #33363F; color: #ECEAE6; display: flex; align-items: center; text-decoration: none">Move to tomorrow</a>
    </div>
    <div style="flex: 1"></div>
    <div style="width: 700px; height: 62px; border-radius: 31px; background: #16181D; border: 1px solid #2C2F38; display: flex; align-items: center; padding: 0 8px 0 24px; gap: 8px; box-sizing: border-box">
      <span style="flex: 1; color: #8E8A83">Talk or type to Navi…</span>
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #23262D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEAE6" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span>
    </div>
    <p style="margin: 0; font-size: 13px; color: #8E8A83">No insight shown — nothing else needs you tonight.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0A44B","options":["#F0A44B","#8FB8FF","#7FD1AE","#E58FB5"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#F0A44B' }; }
}
</script>
</body>
</html>
