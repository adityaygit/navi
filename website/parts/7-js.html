      tabs.forEach(function (t, j) {
        var on = i === j; t.setAttribute("aria-selected", on ? "true" : "false"); t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      });
      showShot(ph, i); if (focus) tabs[i].focus();
    }
    tabs.forEach(function (t, i) {
      t.addEventListener("click", function () { sel(i); });
      t.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); sel((i + 1) % tabs.length, true); }
        if (e.key === "ArrowLeft") { e.preventDefault(); sel((i - 1 + tabs.length) % tabs.length, true); }
        if (e.key === "Home") { e.preventDefault(); sel(0, true); }
        if (e.key === "End") { e.preventDefault(); sel(tabs.length - 1, true); }
      });
    });
  })();

  /* ---------- FAQ ---------- */
  var FAQ = [
    ["Using Navi", "What is Navi?", "A personal planner you talk to. You tell it about your life by text or voice, it proposes a plan, and once you've checked it, it helps you keep to it: daily plans, focus, an inbox for things you mention, and a weekly look back."],
    ["Using Navi", "Do I have to fill in a setup form?", "No. Setup is one conversation. Navi suggests routines, commitments and a first plan from it, and you turn on what's right. Anything you leave off waits in Inbox."],
    ["Using Navi", "Will Navi do things without asking?", "Inside your own plan it can make small changes straight away, like moving a block or adding a task, and every change can be undone. Anything that leaves Navi, such as a message sent from your account, waits as a card until you press and hold."],
    ["Using Navi", "Can I use Navi without voice?", "Yes. Everything works by typing. Voice is there when talking is easier, and both share one history."],
    ["Using Navi", "Which devices does it run on?", "There's an app for iPhone and Android, and a web app for when you're at a computer. They share the same account and plan."],
    ["Using Navi", "Does it connect to my other calendars?", "We'll share what Navi connects to before launch. Today, Navi keeps its own plan, built from what you tell it."],
    ["Privacy", "Is my voice recorded?", "Voice conversations are saved to your chat as text so you can read them back. The audio itself isn't kept."],
    ["Privacy", "What does Navi remember about me?", "What it remembers is written as plain sentences in Memory, with where each one came from. Its guesses are marked for you to confirm, and you can edit or delete anything."],
    ["Privacy", "Where can I read the privacy policy?", "On the Privacy page: what Navi keeps, what it never keeps, who can see it and who processes it."],
    ["Early access", "How do I get access?", "Leave your email on the early access page. You'll get a link to a short application, about two minutes. When there's room, you'll get an email with a link that signs you straight in."],
    ["Early access", "How much will Navi cost?", "During early access, Navi is free. Pricing after that hasn't been announced."],
    ["Early access", "When will Navi launch?", "There's no public date yet. Early access comes first."]
  ];
  (function () {
    var list = $("#faq-list"), q = $("#faq-q"), chips = $$("#faq-chips button"), empty = $("#faq-empty"), cat = "all";
    list.innerHTML = FAQ.map(function (f, i) {
      return '<div class="acc-item" data-cat="' + f[0] + '"><h3><button type="button" aria-expanded="false" aria-controls="fa-' + i + '" id="fq-' + i + '"><span>' + f[1] + '</span><span class="pm" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span></button></h3><div class="acc-panel" id="fa-' + i + '" role="region" aria-labelledby="fq-' + i + '"><div><p>' + f[2] + '</p></div></div></div>';
    }).join("");
    $$(".acc-item button", list).forEach(function (b) {
      b.addEventListener("click", function () { var it = b.closest(".acc-item"), on = !it.classList.contains("open"); it.classList.toggle("open", on); b.setAttribute("aria-expanded", on ? "true" : "false"); });
    });
    function filter() {
      var s = q.value.trim().toLowerCase(), n = 0;
      $$(".acc-item", list).forEach(function (it, i) {
        var f = FAQ[i], ok = (cat === "all" || f[0] === cat) && (!s || (f[1] + " " + f[2]).toLowerCase().indexOf(s) >= 0);
        it.hidden = !ok; if (ok) n++;
      });
      empty.hidden = n > 0;
    }
    q.addEventListener("input", filter);
    chips.forEach(function (c) { c.addEventListener("click", function () { cat = c.getAttribute("data-cat"); chips.forEach(function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); }); filter(); }); });
  })();

  /* ---------- early access: the live site's waitlist flow ----------
     Posts the email (plus a hidden honeypot field) to the Navi app's /api/waitlist on the same
     site, which emails a link to a short application. The artifact preview can't reach that API,
     so there a failed request says so instead of pretending. */
  function onNavi() { return /(^|\.)meetnavi\.app$|\.vercel\.app$|^localhost$|^127\.0\.0\.1$/.test(location.hostname); }
  var WL_NOTE = { sent: "Check your inbox for a short application.", invalid: "That email address doesn\u2019t look right.", error: "Something went wrong on our side. Try again in a minute.", offline: "Couldn\u2019t reach Navi from this preview. Sign-up works on the live site." };
  $$("form[data-waitlist]").forEach(function (f) {
    var btn = $("button[type=submit]", f), note = $(".wl-note", f), label = btn.textContent;
    function set(st) {
      btn.disabled = st === "sending" || st === "sent";
      f.email.disabled = st === "sent";
      btn.textContent = st === "sending" ? "Sending\u2026" : st === "sent" ? "Sent" : label;
      note.textContent = WL_NOTE[st] || "";
      note.className = "wl-note" + (st === "sent" ? " ok" : WL_NOTE[st] ? " bad" : "");
    }
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      set("sending");
      fetch("/api/waitlist", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: f.email.value, website: f.website.value }) })
        .then(function (res) { set(res.ok ? "sent" : res.status === 400 ? "invalid" : onNavi() ? "error" : "offline"); })
        .catch(function () { set(onNavi() ? "error" : "offline"); });
    });
  });
  $$("[data-live-only]").forEach(function (el) { el.hidden = !onNavi(); });

  /* ---------- go ---------- */
  RM.addEventListener && RM.addEventListener("change", function () { tick(); });
  if (!location.hash) {
    var OLD = { "/how-it-works": "product", "/features": "product", "/privacy-and-control": "privacy", "/about": "about", "/terms": "terms", "/guides": "faq" };
    var path = location.pathname.replace(/\/+$/, "");
    history.replaceState(null, "", "#" + (OLD[path] || (path.indexOf("/guides/") === 0 ? "faq" : "home")));
  }
  go();
})();
</script>
