<style>
/* ================= HOME ================= */
.hero { position: relative; margin-top: 10px; height: calc(100svh - 20px); min-height: 680px; max-height: 1080px; overflow: hidden; background: #C9DDF4; --hp: 0; }
.hero-sky { position: absolute; inset: -4% -2% -2% -2%; transform: translate3d(0, calc(var(--hp) * 7%), 0) scale(calc(1.04 + var(--hp) * .05)); will-change: transform; }
.hero-sky img, .hero-sky picture { width: 100%; height: 100%; object-fit: cover; object-position: 50% 80%; }
.hero-sky::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 30%, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); }
.hero-copy { position: relative; z-index: 2; padding-top: calc(env(safe-area-inset-top, 0px) + clamp(112px, 15vh, 150px)); text-align: center; color: var(--navy); transform: translate3d(0, calc(var(--hp) * -120px), 0); opacity: calc(1 - var(--hp) * 1.7); filter: blur(calc(var(--hp) * 10px)); will-change: transform, opacity; }
.hero-copy .d-xl { text-shadow: 0 2px 60px rgba(255,255,255,.35); font-size: clamp(50px, min(8.6vw, 11.5vh), 140px); }
.hero-copy .lead { margin: clamp(16px, 2.6vh, 26px) auto 0; color: #1F3554; max-width: 31em; padding: 0 12px; }
.hero-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: clamp(20px, 3.4vh, 32px); }
.hero-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
.hero-phone { position: relative; z-index: 1; margin-top: clamp(28px, 5vh, 56px); transform: translate3d(0, calc(var(--hp) * -34vh), 0); opacity: clamp(0, calc(1.9 - var(--hp) * 2.6), 1); will-change: transform, opacity; }
.hero-phone .phone { --w: clamp(200px, min(18vw, 30vh), 270px); --rx: calc(18deg - var(--hp) * 18deg); }
.hero-front { position: absolute; left: -12%; right: -12%; bottom: 0; height: clamp(260px, 40vh, 470px); z-index: 3; pointer-events: none; transform: translate3d(0, calc(var(--hp) * 30%), 0) scale(calc(1 + var(--hp) * .1)); transform-origin: 50% 100%; will-change: transform; }
.hero-front img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; filter: drop-shadow(0 -10px 40px rgba(255,255,255,.35)); }
.hero-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 16%; z-index: 4; background: linear-gradient(rgba(220,233,248,0), #DCE9F8); pointer-events: none; }
.scroll-cue { position: absolute; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--navy); opacity: calc(1 - var(--hp) * 4); }
.scroll-cue i { width: 22px; height: 34px; border-radius: 12px; border: 2px solid currentColor; position: relative; opacity: .7; }
.scroll-cue i::after { content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 7px; margin-left: -2px; border-radius: 2px; background: currentColor; animation: cue 1.8s var(--e-io) infinite; }
@keyframes cue { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(11px); opacity: 0; } 100% { opacity: 0; } }
@media (max-width: 700px) { .hero-copy .lead { font-size: 17px; } .hero-front { height: 30vh; left: -40%; right: -40%; } .hero-phone .phone { --w: min(230px, 58vw); } }

/* pinned story */
.story { position: relative; height: 460vh; --sp: 0; background: linear-gradient(180deg, var(--paper) 0, #DCE9F8 200px); }
.story-stick { position: sticky; top: 0; height: 100svh; overflow: hidden; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(24px, 5vw, 80px); padding: 0 var(--gutter-r) 0 var(--gutter); }
.story-bg { position: absolute; inset: 0; background: linear-gradient(180deg, var(--paper) 0, #DCE9F8 180px, #EEF4FB 55%, #FBFBFD 100%); }
.story-bg::after { content: ""; position: absolute; inset: 0; background: #FBFBFD; opacity: calc(var(--sp) * 1.3); }
.story-steps { position: relative; justify-self: end; list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-width: 360px; }
.story-steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; color: var(--faint); transition: color .45s; }
.story-steps li .n { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 13px; font-weight: 800; transition: background-color .45s, color .45s, border-color .45s; }
.story-steps li b { display: block; font-size: clamp(20px, 1.9vw, 26px); line-height: 1.15; letter-spacing: -0.025em; font-weight: 800; }
.story-steps li.on { color: var(--ink); }
.story-steps li.on .n { background: var(--ink); border-color: var(--ink); color: #fff; }
.story-steps li.done { color: #9BA3B4; }
.story-phone { position: relative; }
.story-phone .phone { --w: clamp(210px, 18vw, 260px); --ry: calc(-8deg + var(--sp) * 16deg); --rx: 4deg; }
.story-text { position: relative; max-width: 380px; min-height: 280px; }
.story-text > div { position: absolute; inset: 0 auto auto 0; opacity: 0; transform: translateY(18px); transition: opacity .5s var(--e-out), transform .7s var(--e-out); pointer-events: none; }
.story-text > div.on { opacity: 1; transform: none; pointer-events: auto; }
.story-text p.body { font-size: 19px; }
.story-text .crop { margin-top: 22px; width: min(330px, 100%); }
.story-bar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); width: 140px; height: 3px; border-radius: 2px; background: rgba(11,15,23,.1); overflow: hidden; }
.story-bar i { display: block; height: 100%; width: calc(var(--sp) * 100%); background: var(--ink); }
@media (max-width: 900px) {
  .story { height: 420vh; }
  .story-stick { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; gap: 22px; padding-top: 70px; }
  .story-steps { display: none; }
  .story-phone .phone { --w: min(200px, 46vw); }
  .story-text { text-align: center; min-height: 230px; width: 100%; max-width: 420px; }
  .story-text > div { left: 0; right: 0; }
  .story-text .crop { margin: 16px auto 0; width: min(290px, 86%); }
  .story-text p.body { font-size: 17px; margin: 0 auto; }
}

/* bento of environments */
.bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.bc { position: relative; border-radius: 36px; overflow: hidden; min-height: 600px; padding: clamp(26px, 3vw, 40px); display: flex; flex-direction: column; text-decoration: none; isolation: isolate; transition: transform .6s var(--e-out), box-shadow .6s var(--e-out); box-shadow: var(--sh-1); }
.bc:hover { transform: translateY(-4px); box-shadow: var(--sh-2); }
.bc .h3 { position: relative; z-index: 2; max-width: 15em; }
.bc .body { position: relative; z-index: 2; margin-top: 10px; max-width: 26em; }
.bc .go { position: absolute; z-index: 3; right: 22px; top: 22px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; transition: transform .45s var(--e-out); }
.bc:hover .go { transform: rotate(-45deg); }
.bc .bg { position: absolute; inset: 0; z-index: -1; }
.bc .bg img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--e-out); }
.bc:hover .bg img { transform: scale(1.04); }
.bc .ph-wrap { margin-top: auto; display: flex; justify-content: center; padding-top: 34px; margin-bottom: calc(clamp(26px, 3vw, 40px) * -1 - 120px); }
.bc .ph-wrap .phone { --w: 270px; transition: transform .8s var(--e-out); }
.bc:hover .ph-wrap .phone { transform: translateY(-14px) rotateX(var(--rx)) rotateY(var(--ry)); }
.bc-plan { grid-column: span 7; background: #fff; border: 1px solid var(--line); }
.bc-voice { grid-column: span 5; background: radial-gradient(120% 90% at 50% 100%, #E9E6FF 0%, #F4F2FF 45%, #FBFBFD 100%); }
.bc-focus { grid-column: span 5; color: var(--navy); }
.bc-week { grid-column: span 7; color: #fff; }
.bc-week .body { color: rgba(255,255,255,.88); }
.bc-voice .orb-wrap { margin-top: auto; display: grid; place-items: center; padding: 40px 0 10px; }
.bc .go { background: rgba(11,15,23,.06); }
.bc-week .go { background: rgba(255,255,255,.2); color: #fff; }
.bc .pair { display: flex; gap: 18px; justify-content: center; }
.bc .pair .phone { --w: 230px; }
@media (max-width: 960px) { .bc-plan, .bc-voice, .bc-focus, .bc-week { grid-column: 1 / -1; } .bc { min-height: 540px; } }
@media (max-width: 560px) { .bc .pair .phone:nth-child(2) { display: none; } .bc .ph-wrap .phone { --w: 230px; } }

/* ask before acting */
.ask { display: grid; grid-template-columns: 1fr 1.05fr; gap: clamp(32px, 6vw, 96px); align-items: center; }
.ask-stack { position: relative; display: grid; gap: 18px; }
.ask-row { display: grid; gap: 10px; }
.ask-row .tag { font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.ask-row .tag i { width: 9px; height: 9px; border-radius: 50%; }
.ask-row img { width: 100%; max-width: 520px; border-radius: 26px; box-shadow: var(--sh-2); }
.hold-demo { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.hold { --fill: 0; position: relative; overflow: hidden; height: 56px; padding: 0 28px; border-radius: 999px; background: #1A2130; color: #fff; font-weight: 700; font-size: 17px; isolation: isolate; user-select: none; -webkit-user-select: none; touch-action: none; transition: transform .3s var(--e-out); }
.hold::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ink); }
.hold::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #3B4A66, #56709A); transform-origin: 0 50%; transform: scaleX(var(--fill)); }
.hold.held { transform: scale(.97); }
.hold.done { background: var(--kept); }
.hold.done::after { background: var(--kept); }
.hold-msg { font-size: 15px; font-weight: 600; color: var(--muted); min-height: 1.5em; }
@media (max-width: 860px) { .ask { grid-template-columns: 1fr; } }

.ask.even, .ea.even { grid-template-columns: 1fr 1fr; }
.duo { display: flex; gap: 22px; justify-content: center; }
.duo .phone { --w: clamp(200px, 20vw, 270px); }
@media (max-width: 860px) { .ask.even, .ea.even { grid-template-columns: 1fr; } .duo { gap: 12px; } .duo .phone { --w: min(170px, 42vw); } }

/* dusk band */
.dusk { position: relative; overflow: hidden; color: #fff; padding-block: clamp(100px, 14vw, 190px); background: #8C86A8; }
.dusk .bgimg { position: absolute; inset: -10% 0; z-index: 0; }
.dusk .bgimg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; transform: translate3d(0, calc(var(--dp, 0) * -8%), 0); }
.dusk::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(30,28,60,.28) 0%, rgba(30,28,60,0) 55%); }
.dusk .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.dusk .lead, .dusk .body { color: rgba(255,255,255,.92); }
.dusk .quote { margin-top: 30px; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; font-style: italic; }
.dusk .src { margin-top: 12px; font-size: 14px; color: rgba(255,255,255,.75); font-weight: 600; }
.fan { position: relative; height: 600px; }
.fan .phone { position: absolute; top: 40px; --w: 240px; }
.fan .phone:nth-child(1) { left: 6%; --rz: -7deg; --ry: 14deg; transform: translateY(calc(var(--dp, 0) * 40px)) rotateY(var(--ry)) rotateZ(var(--rz)); }
.fan .phone:nth-child(2) { right: 4%; top: 70px; --rz: 6deg; --ry: -14deg; transform: translateY(calc(var(--dp, 0) * -40px)) rotateY(var(--ry)) rotateZ(var(--rz)); }
@media (max-width: 900px) { .dusk .wrap { grid-template-columns: 1fr; } .fan { height: 520px; max-width: 460px; width: 100%; margin: 0 auto; } .fan .phone { --w: 220px; } }

/* how it starts */
.starts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.starts figure { margin: 0; display: grid; gap: 18px; }
.starts .phone { --w: 100%; max-width: 250px; margin: 0 auto; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18), inset 0 0 0 4px #0b0c0e, var(--sh-2); }
.starts figcaption { display: grid; gap: 4px; }
.starts figcaption b { font-size: 19px; letter-spacing: -0.02em; display: flex; gap: 10px; align-items: baseline; }
.starts figcaption b i { font-style: normal; font-size: 13px; font-weight: 800; color: var(--muted); }
.starts figcaption span { color: var(--muted); font-size: 15.5px; line-height: 1.45; }
@media (max-width: 900px) { .starts { grid-template-columns: 1fr 1fr; gap: 40px 16px; } }

/* CTA band */
.cta-band { position: relative; overflow: hidden; min-height: 760px; display: flex; align-items: flex-start; padding-top: clamp(110px, 13vw, 170px); background: #E9EEF6; }
.cta-band .bgimg { position: absolute; inset: 0; }
.cta-band .bgimg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
.cta-band .wrap { position: relative; text-align: center; color: var(--navy); }
.cta-band .lead { margin: 22px auto 0; color: #2A3A55; }
.inline-form { margin: 34px auto 0; display: flex; gap: 8px; padding: 8px; border-radius: 999px; max-width: 520px; }
.inline-form input { flex: 1; min-width: 0; height: 52px; border: 0; background: transparent; padding: 0 18px; font-size: 17px; outline: none; }
.inline-form input::placeholder { color: #66708A; }
.inline-form:focus-within { outline: 2.5px solid var(--link); outline-offset: 3px; }
@media (max-width: 520px) { .inline-form { flex-direction: column; border-radius: 28px; } .inline-form .btn { width: 100%; } }

/* ================= PRODUCT ================= */
.p-hero { position: relative; overflow: hidden; background: linear-gradient(180deg, #E4EEF9 0%, #F3F7FC 45%, var(--paper) 100%); padding-bottom: 60px; }
.p-hero .wrap { text-align: center; }
.p-hero .lead { margin: 24px auto 0; }
.arc { position: relative; height: clamp(420px, 44vw, 600px); margin-top: 60px; perspective: 2000px; }
.arc .phone { position: absolute; left: 50%; top: 0; --w: clamp(150px, 15.5vw, 230px); margin-left: calc(var(--w) / -2); transition: transform 1.1s var(--e-out); transform: translateX(calc(var(--i) * var(--spread, 1) * clamp(120px, 13vw, 210px))) translateY(calc(var(--i) * var(--i) * 14px + 20px)) rotateY(calc(var(--i) * -12deg)) rotateZ(calc(var(--i) * 3deg)); z-index: calc(10 - var(--a)); }
.arc .phone:hover { transform: translateX(calc(var(--i) * var(--spread, 1) * clamp(120px, 13vw, 210px))) translateY(calc(var(--i) * var(--i) * 14px - 4px)) rotateY(calc(var(--i) * -12deg)) rotateZ(calc(var(--i) * 3deg)); }
@media (max-width: 640px) { .arc { height: 380px; } .arc .phone { --w: 150px; } .arc .phone[style*="--a:2"] { display: none; } }

.cap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.cap-list { list-style: none; margin: 0; padding: 0; }
.cap-list li { padding: 40px 0; border-top: 1px solid var(--line); min-height: 64vh; display: flex; flex-direction: column; justify-content: center; }
.cap-list li .h2, .cap-list li .body { transition: color .5s; }
@media (min-width: 861px) { .cap-list li:not(.on) .h2 { color: #6B7385; } .cap-list li:not(.on) .body { color: #646C7E; } }
.cap-list li .h2 { font-size: clamp(32px, 3.6vw, 52px); }
.cap-list li .body { margin-top: 16px; font-size: 18.5px; }
.cap-list li .tlink { margin-top: 22px; align-self: flex-start; }
.cap-list li .mobile-shot { display: none; }
.cap-stick { position: sticky; top: 0; height: 100svh; display: grid; place-items: center; }
.cap-stick .phone { --w: clamp(220px, 19vw, 260px); --ry: -6deg; }
@media (max-width: 860px) { .cap { grid-template-columns: 1fr; } .cap-stick { display: none; } .cap-list li { opacity: 1; min-height: 0; padding: 56px 0; } .cap-list li .mobile-shot { display: flex; justify-content: center; margin-top: 34px; } .cap-list li .mobile-shot .phone { --w: 220px; } }

.runs { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 16px; }
.run { border-radius: 32px; background: #fff; border: 1px solid var(--line); padding: 30px; display: flex; flex-direction: column; gap: 10px; min-height: 360px; }
.run .h3 { margin-top: 6px; }
.run .status { margin-top: auto; font-size: 14px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.run .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.run .ph { flex: 1; min-height: 190px; margin-top: 10px; }
.run .icon { width: 46px; height: 46px; border-radius: 14px; background: var(--mist); display: grid; place-items: center; }
@media (max-width: 960px) { .runs { grid-template-columns: 1fr; } }

.honest { margin-top: 16px; border-radius: 28px; padding: 26px 30px; background: var(--ok-bg); color: #6B4210; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.honest b { color: #4F300A; }
.honest p { margin: 0; }

/* ================= FEATURE PAGES (shared bits) ================= */
.f-hero { position: relative; overflow: hidden; padding-top: calc(env(safe-area-inset-top, 0px) + 150px); padding-bottom: clamp(70px, 9vw, 120px); }
.f-hero .grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; }
.f-hero .lead { margin-top: 26px; }
.f-hero .stage { display: flex; justify-content: center; }
@media (max-width: 900px) { .f-hero .grid { grid-template-columns: 1fr; } }
.points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.pt { border-radius: 30px; background: #fff; border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; gap: 10px; }
.pt .h3 { font-size: 22px; }
.pt .body { font-size: 16.5px; color: var(--muted); }
.pt img.crop { margin-top: auto; border-radius: 18px; box-shadow: var(--sh-1); border: 1px solid var(--line); }
@media (max-width: 900px) { .points { grid-template-columns: 1fr; } }

/* plan page tabs */
.p-tabs { display: grid; grid-template-columns: .9fr 1.1fr; gap: 56px; align-items: center; }
.tablist { display: inline-flex; padding: 5px; border-radius: 999px; background: var(--mist); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.tablist button { height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 700; font-size: 15.5px; color: var(--muted); transition: background-color .25s, color .25s, box-shadow .25s; }
.tablist button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 4px 12px -6px rgba(14,30,60,.35); }
.tabpanels { margin-top: 30px; min-height: 230px; }
.tabpanels [role="tabpanel"] { animation: pageIn .5s var(--e-out) both; }
.tabpanels .h3 { margin-bottom: 12px; }
.p-tabs .stage { display: flex; justify-content: center; }
.p-tabs .phone { --w: clamp(260px, 25vw, 330px); --ry: -10deg; transition: transform .9s var(--e-out); }
.facts { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; color: var(--ink-2); }
.facts li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin: 9px 0 0 6px; }
@media (max-width: 900px) { .p-tabs { grid-template-columns: 1fr; } .p-tabs .stage { order: -1; } }

/* voice */
.v-hero { position: relative; overflow: hidden; background: radial-gradient(90% 70% at 50% 62%, #E3DEFF 0%, #EFEDFF 38%, #F7F7FC 70%, var(--paper) 100%); padding-top: calc(env(safe-area-inset-top, 0px) + 150px); padding-bottom: 110px; text-align: center; }
.v-hero .lead { margin: 22px auto 0; }
.big-orb { margin: 60px auto 0; position: relative; width: min(380px, 70vw); aspect-ratio: 1; --os: 380px; cursor: pointer; border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none; }
.big-orb .orb { width: 100%; height: 100%; box-shadow: 0 50px 120px -30px rgba(86,80,180,.45), 0 0 0 1px rgba(255,255,255,.6) inset; transition: transform .45s var(--e-out); }
.big-orb.held .orb { transform: scale(1.12); transition: transform .45s cubic-bezier(.3,0,.2,1); }
.big-orb .halo { position: absolute; inset: -14%; border-radius: 50%; border: 1px solid rgba(110,100,220,.25); animation: halo 3.6s var(--e-out) infinite; pointer-events: none; }
.big-orb .halo:nth-child(2) { animation-delay: 1.2s; } .big-orb .halo:nth-child(3) { animation-delay: 2.4s; }
@keyframes halo { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.orb-hint { margin-top: 26px; font-weight: 700; font-size: 15px; color: #4B4680; min-height: 1.5em; }
.transcript { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
.bub { padding: 14px 18px; border-radius: 22px; font-size: 17px; line-height: 1.45; max-width: 86%; }
.bub.me { justify-self: end; background: var(--ink); color: #fff; border-radius: 22px 22px 8px 22px; }
.bub.navi { justify-self: start; background: #fff; border: 1px solid var(--line); border-radius: 22px 22px 22px 8px; box-shadow: var(--sh-1); }
.bub small { display: block; font-size: 12.5px; opacity: .65; margin-top: 4px; font-weight: 600; }

/* focus */
.fo-hero { position: relative; overflow: hidden; min-height: 100svh; color: var(--navy); display: flex; align-items: flex-start; }
.fo-hero .bgimg { position: absolute; inset: 0; }
.fo-hero .bgimg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; transform: scale(calc(1.06 + var(--fp, 0) * .08)) translateY(calc(var(--fp, 0) * 4%)); }
