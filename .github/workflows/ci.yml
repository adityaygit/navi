name: CI

# Typecheck, lint, unit + integration tests against a throwaway local Supabase,
# production build, and browser tests (desktop + emulated iPhone) using the
# labelled development simulator. No secrets or real AI providers involved.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Start local Supabase
        run: npm run db:start
      - name: Write local test settings
        run: node scripts/local-env.mjs
      - name: Unit + integration tests
        run: npx vitest run
      - name: Build
        run: npx next build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          NAVI_ALLOW_DEVSIM=true nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat next.log; exit 1
      - name: Browser tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            next.log
          retention-days: 7
